stages: [run]

include:
  - component: $CI_SERVER_FQDN/common/ci-shared/cmake-workflow@main
    inputs:
      job_prefix: debug
      image: "docker.io/ubuntu:24.04"
      before_script:
        - apt update
        - DEBIAN_FRONTEND=noninteractive apt install -y git doxygen g++ cmake ninja-build libboost-all-dev libglew-dev libeigen3-dev qtbase5-dev libhdf5-dev libomp-dev libglm-dev libglut-dev libfreeimageplus-dev
      workflow_preset: "debug-test"
      build_dir: "build/debug"

  - component: $CI_SERVER_FQDN/common/ci-shared/cmake-workflow@main
    inputs:
      job_prefix: debug-unstable
      image: "docker.io/debian:unstable"
      before_script:
        - apt update
        - DEBIAN_FRONTEND=noninteractive apt install -y git doxygen g++ cmake ninja-build libboost-all-dev libglew-dev libeigen3-dev qtbase5-dev libhdf5-dev libomp-dev libglm-dev libglut-dev libfreeimageplus-dev
      workflow_preset: "debug-test"
      build_dir: "build/debug"
